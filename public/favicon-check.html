<!DOCTYPE html>
<html>
<head>
  <title>Favicon Check</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    img { border: 1px solid #ccc; margin: 20px; }
    h2 { margin-top: 30px; }
  </style>
</head>
<body>
  <h1>Avidato Favicon Check</h1>
  
  <h2>192x192 PNG</h2>
  <img src="/android-chrome-192x192.png" alt="192x192 favicon" width="192" height="192">
  
  <h2>512x512 PNG</h2>
  <img src="/android-chrome-512x512.png" alt="512x512 favicon" width="512" height="512">
  
  <h2>Logo SVG (for comparison)</h2>
  <img src="/logo.svg" alt="Logo SVG" width="192" height="192">
</body>
</html>
